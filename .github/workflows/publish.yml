name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'          # publish on version tags: v0.1.0, v1.2.3, etc.
  workflow_dispatch:       # or trigger manually from the Actions tab
    inputs:
      dry-run:
        description: 'Run build + tests but skip publish'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write           # required to publish to GitHub Packages

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@llazyemail'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist exists
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (dry-run)
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
