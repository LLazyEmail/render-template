name: Sandbox HTML

# Separate from build.yml. Install, index, artifact, and the pull-request
# comment come from LLazyEmail/email-template-workflows@v3.
# npm run sandbox builds via prepare, then writes sandbox/generated/*.html.
# v3 defaults are generic (product-name=files, size-limit-kb=0, artifact-name=rendered);
# this workflow already sets artifact-name and keeps the new product-name default.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  generate:
    name: Generate sandbox HTML
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: LLazyEmail/email-template-workflows@7b1ab4df2fb9391fea155effcef1aaaadf3efead # v3.1.0
        with:
          working-directory: .
          package-manager: npm
          command: npm run sandbox
          artifact-directory: sandbox/generated
          artifact-name: sandbox-html
          product-name: files
          size-limit-kb: 0
          job-summary: true
