name: Sandbox HTML

# Separate from build.yml. Install, index, artifact, and the pull-request
# comment come from LLazyEmail/email-template-workflows@v2.5.0.
# npm run sandbox builds via prepare, then writes sandbox/generated/*.html.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sandbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  generate:
    name: Generate sandbox HTML
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: LLazyEmail/email-template-workflows@d033cc177f9fff39fd4baa74df0d2ea07e6a42cb # v2.5.0
        with:
          working-directory: .
          package-manager: npm
          command: npm run sandbox
          artifact-directory: sandbox/generated
          artifact-name: sandbox-html
          job-summary: true
